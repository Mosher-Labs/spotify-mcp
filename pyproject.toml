[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotify-mcp"
version = "0.1.0"
description = "MCP server that builds Spotify playlists for a workout, matching energy and tempo"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = [
    # Same cap as garmin-mcp: mcp 2.x renamed mcp.server.fastmcp.
    "mcp>=1.28.1,<2",
    "httpx==0.28.1",
]

[project.scripts]
spotify-mcp = "spotify_mcp.server:main"
spotify-mcp-auth = "spotify_mcp.auth_cli:main"
spotify-mcp-strava-auth = "spotify_mcp.strava_auth_cli:main"
spotify-mcp-strava-backfill = "spotify_mcp.strava_backfill_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
